name: Automated Smoke Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-smoke-tests:
  # Sử dụng máy chủ ảo Ubuntu mới nhất
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải mã nguồn từ repository xuống máy ảo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Java (JDK 17) và cache Maven để tăng tốc độ chạy
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 3: Chạy test với nhóm Smoke
      # (-Dgroups=smoke dùng chung được cho cả JUnit 5 @Tag("smoke") và TestNG groups="smoke")
      - name: Run Smoke Tests with Maven
        run: mvn test -Dgroups=smoke

      # Bước 4: Upload Test Report lên GitHub Artifacts
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always() # Luôn chạy bước này kể cả khi test case có bị Fail (để lấy report lỗi về xem)
        with:
          name: smoke-test-reports
          path: |
            target/surefire-reports/
            target/site/
            target/extent-reports/ # Thay đổi đường dẫn này nếu thư mục lưu Extent Report của bạn khác
          retention-days: 30 # Thời gian lưu trữ report trên GitHub (tối đa tùy chỉnh, ví dụ 30 ngày)
